[package]
name = "manifold"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An experimental binary decompiler: CompCert's compilation pipeline run in reverse, as Ascent Datalog rules"
repository = "https://github.com/changliu98/manifold"

[dependencies]
ascent = { path = "./ascent-plusplus/ascent", features = ["par"], default-features = true}
csv = "1.3.1"
either = "1.13.0"
strum = "0.27.1"
strum_macros = "0.27.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
log = "0.4.21"
capstone = "0.13.0"
object = "0.38.1"
rayon = "1.10"
z3 = "0.20"
# The user-propagator API and the raw Z3_solver handle are not wrapped by `z3`.
z3-sys = "0.11"

[features]
par = ["ascent/par"]

[profile.dev]
opt-level = 0
codegen-units = 256
debug = 0
incremental = true
debug-assertions = false
overflow-checks = false

[profile.dev.build-override]
opt-level = 3
codegen-units = 16

[profile.release]
lto = "none"
codegen-units = 256
# Release is the profile the full-corpus runs use, so it has to be optimized:
# at opt-level 0 the decompiler ran 2.5-5x slower and six Coreutils binaries
# (cp, ginstall, mv, numfmt, sort, tail) exceeded the integration runner's
# 600-second per-binary timeout, which alone put 153 reference-passable tests
# out of reach.  sort takes 128s here and timed out at 600s unoptimized.
# Iterate with a debug build; this profile buys run time with build time.
opt-level = 3
panic = "abort"
strip = true
debug = 0
incremental = true

[profile.release.build-override]
opt-level = 3
codegen-units = 16
